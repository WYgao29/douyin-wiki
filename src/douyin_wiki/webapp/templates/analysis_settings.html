<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ page_title }} · 抖库</title>
  <script src="/static/theme.js?v={{ web_version }}"></script>
  <link rel="stylesheet" href="/static/app.css?v={{ web_version }}">
</head>
<body>
  <a class="skip-link" href="#settings-main">跳到主要内容</a>
  <div class="settings-shell">
    <aside class="settings-sidebar" aria-label="设置导航">
      <a class="brand" href="/" aria-label="返回抖库资料库"><span class="brand-mark" aria-hidden="true"><img src="/static/brand-mark.png?v={{ web_version }}" alt=""></span><span class="brand-copy"><strong>抖库</strong><small>个人知识工作台</small></span></a>
      <nav class="settings-nav" aria-label="设置分类">
        <a class="active" href="/settings/analysis"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor" stroke="none"><path fill-rule="evenodd" d="M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18Zm0-13.9a1.1 1.1 0 0 0-1.1 1.1v3.7a1.1 1.1 0 0 0 1.1 1.1h4.2a1.1 1.1 0 1 0 0-2.2h-3.1V8.2A1.1 1.1 0 0 0 12 7.1Z"/></g></svg><span>导入分析</span></a>
        <a href="/settings/model"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor" stroke="none"><rect x="3" y="5" width="18" height="2.3" rx="1.15" opacity=".35"/><rect x="3" y="10.85" width="18" height="2.3" rx="1.15" opacity=".35"/><rect x="3" y="16.7" width="18" height="2.3" rx="1.15" opacity=".35"/><circle cx="8.5" cy="6.15" r="2.7"/><circle cx="15.5" cy="12" r="2.7"/><circle cx="9.5" cy="17.85" r="2.7"/></g></svg><span>对话模型</span></a>
      </nav>
      <div class="sidebar-footer">
        <label class="theme-control"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor" stroke="none"><path fill-rule="evenodd" d="M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18Zm0-16.2V19.2a7.2 7.2 0 0 0 0-14.4Z"/></g></svg><span>外观</span><select data-theme-select aria-label="选择页面主题"><option value="system">跟随系统</option><option value="light">亮色</option><option value="dark">暗色</option></select></label>
        <a class="settings-nav-link" href="/"><svg aria-hidden="true"><use href="/static/icons.svg#chevron-left"></use></svg><span>返回资料库</span></a>
        <span class="sidebar-version">Web v{{ web_version }} · 仅本机</span>
      </div>
    </aside>

    <main class="settings-main" id="settings-main" tabindex="-1">
      <header class="settings-heading">
        <span class="page-kicker"><svg aria-hidden="true"><use href="/static/icons.svg#sparkles"></use></svg>导入后整理</span>
        <h1>导入分析</h1>
        <p>选择采集完成后由谁整理。只有「后台模型接口」才需要配置对话模型。</p>
      </header>

      <section class="model-status-card" aria-live="polite">
        <span id="analysis-status-dot" class="status-indicator" aria-hidden="true"></span>
        <div><strong id="analysis-status-title">正在读取配置…</strong><p id="analysis-status-copy">请稍候</p></div>
      </section>

      <section class="settings-section" aria-labelledby="analysis-title">
        <header><h2 id="analysis-title">导入后的分析方式</h2><p>这决定采集任务要不要等外部 Agent。保存后不会在导入时静默改回去。</p></header>
        <fieldset class="analysis-mode-list">
          <legend class="sr-only">分析模式</legend>
          <label class="analysis-mode-card"><input type="radio" name="analysis-mode" value="provider"><span><strong>后台模型接口</strong><small>导入后由 Worker 用对话模型自动整理，可能消耗 Token。适合纯网页操作。</small></span></label>
          <label class="analysis-mode-card"><input type="radio" name="analysis-mode" value="local"><span><strong>本地模式</strong><small>不调用外部模型，使用本地降级整理。</small></span></label>
          <label class="analysis-mode-card"><input type="radio" name="analysis-mode" value="gateway"><span><strong>网关 Agent</strong><small>下载和提取由后台完成，校正和分析要等 OpenClaw/Hermes 等 Agent。</small></span></label>
        </fieldset>
        <div id="provider-model-panel" class="settings-callout hidden">
          <svg aria-hidden="true"><use href="/static/icons.svg#sparkles"></use></svg>
          <div>
            <strong id="provider-model-title">需要配置对话模型</strong>
            <p id="provider-model-copy">后台整理会调用对话模型页的同一套接口。</p>
            <p class="analysis-followup"><a href="/settings/model">去配置对话模型</a></p>
          </div>
        </div>
        <div id="settings-message" class="settings-message" role="status" aria-live="polite"></div>
        <div class="settings-actions analysis-mode-actions"><button id="save-analysis-mode" type="button" class="primary-button">保存分析方式</button><span>保存后会请求 Worker 重载，使之后的导入任务生效。</span></div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/analysis-settings.js?v={{ web_version }}" defer></script>
</body>
</html>
